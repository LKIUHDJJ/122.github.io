# Bugku Web 滑稽 Writeup
## 题目描述
打开页面全是滑稽表情，需要找到flag。
## 解题思路
Web基础题，flag放在网页HTML注释中，页面不可见，查看源码即可获取。
## 解题步骤
1. 启动靶场，访问题目给的链接。
2. 使用快捷键 Ctrl+U 打开网页源代码。
3. Ctrl+F搜索关键词flag，找到注释内的flag。
4. 将flag复制提交，完成题目。
