 题目名称
alert
 解题步骤

 1. 点击延时场景，访问靶场链接。

 2. 方式一：Ctrl+U打开网页源代码，查找alert相关JS代码，提取flag。

 3. 方式二：F12打开开发者工具，进入Console控制台，查看弹窗对应的脚本内容。

 4. 复制完整flag，回到题目页面提交。
 知识点
JavaScript alert弹窗，JS脚本代码可以在网页源代码/开发者工具中查看。
